apiVersion: apps/v1
kind: Deployment

metadata:
  name: go-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: go-backend

  template:
    metadata:
      labels:
        app: go-backend

    spec:
      containers:
        - name: backend
          image: tilt-go-backend:dev

          ports:
            - containerPort: 8080

          env:
            - name: PORT
              value: "8080"

            - name: DB_HOST
              value: postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: tilt_demo

            - name: DB_USER
              value: devuser

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD