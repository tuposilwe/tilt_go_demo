apiVersion: apps/v1
kind: Deployment

metadata:
  name: go-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: go-backend

  template:
    metadata:
      labels:
        app: go-backend

    spec:
      containers:
        - name: backend
          image: tilt-go-backend:dev

          ports:
            - containerPort: 8080

          env:
            - name: PORT
              value: "8080"