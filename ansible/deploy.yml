---
- name: Deploy tilt_go_demo to Kubernetes via Helm
  hosts: app
  become: false
  vars:
    image_name: "rudigermkondya/tilt_go_demo"
    image_tag: "latest"
    release_name: "tilt-go-demo"
    kube_namespace: "tilt-go-demo"
    remote_charts_path: "/tmp/tilt-go-demo-charts"

  tasks:
    - name: Copy Helm charts to the deployment host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../charts/"
        dest: "{{ remote_charts_path }}/"

    - name: Locate Helm
      ansible.builtin.shell: |
        if command -v helm >/dev/null 2>&1; then
          command -v helm
        elif [ -x /snap/bin/helm ]; then
          printf '%s\n' /snap/bin/helm
        else
          exit 1
        fi
      register: helm_check
      changed_when: false
      failed_when: false

    - name: Install Helm with Snap when missing
      ansible.builtin.command:
        argv:
          - snap
          - install
          - helm
          - --classic
      when: helm_check.rc != 0

    - name: Set Helm executable path
      ansible.builtin.set_fact:
        helm_bin: "{{ helm_check.stdout if helm_check.rc == 0 else '/snap/bin/helm' }}"

    - name: Install or upgrade PostgreSQL
      ansible.builtin.command:
        argv:
          - "{{ helm_bin }}"
          - upgrade
          - --install
          - postgres
          - "{{ remote_charts_path }}/postgres"
          - --namespace
          - "{{ kube_namespace }}"
          - --create-namespace
          - --wait

    - name: Upgrade or install Helm release
      ansible.builtin.command:
        argv:
          - "{{ helm_bin }}"
          - upgrade
          - --install
          - "{{ release_name }}"
          - "{{ remote_charts_path }}/backend"
          - --namespace
          - "{{ kube_namespace }}"
          - --create-namespace
          - --wait
          - --set-string
          - "image.repository={{ image_name }}"
          - --set-string
          - "image.tag={{ image_tag }}"