---
- name: Deploy tilt_go_demo to Kubernetes via Helm
  hosts: app
  become: false
  vars:
    image_name: "rudigermkondya/tilt_go_demo"
    image_tag: "latest"
    release_name: "tilt-go-demo"
    namespace: "tilt-go-demo"
    chart_path: "{{ playbook_dir }}/../helm/tilt-go-demo"

  tasks:
    - name: Ensure target namespace exists
      kubernetes.core.k8s:
        name: "{{ namespace }}"
        api_version: v1
        kind: Namespace
        state: present

    - name: Upgrade or install Helm release
      kubernetes.core.helm:
        name: "{{ release_name }}"
        chart_ref: "{{ chart_path }}"
        release_namespace: "{{ namespace }}"
        create_namespace: true
        wait: true
        values:
          image:
            repository: "{{ image_name }}"
            tag: "{{ image_tag }}"