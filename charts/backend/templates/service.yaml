apiVersion: v1
kind: Service

metadata:
  name: go-backend

spec:
  selector:
    app: go-backend

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      {{ if eq .Values.service.type "NodePort" }}nodePort: {{ .Values.service.nodePort }}{{ end }}

  type: {{ .Values.service.type }}